# Build and Deploy Workflow (Dev)
#
# Before using this workflow, replace placeholders:
#   - <your-username>: Your GitHub username or organization
#   - <your-app>: Your application name
#   - <your-deploy-path>: Server deployment path (e.g., /srv/myapp)
#
# Required GitHub Secrets:
#   - SSH_HOST: Deployment server hostname
#   - SSH_USER: SSH username
#   - SSH_PRIVATE_KEY: SSH private key
#   - SSH_PORT: SSH port (usually 22)
#   - GHCR_TOKEN: GitHub Container Registry token

name: Build and Deploy (Dev)

on:
  push:
    branches:
      - develop

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_FRONTEND: wisdom-youth-mlpe/meeting-summary-frontend
  IMAGE_NAME_API: wisdom-youth-mlpe/meeting-summary-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and push frontend image
      - name: Extract metadata for Frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}
          tags: |
            type=raw,value=dev
            type=sha,prefix={{branch}}-

      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          no-cache: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          build-args: |
            VITE_API_URL=https://dev.meeting.wisdommlpe.site

      # Build and push API image
      - name: Extract metadata for API
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_API }}
          tags: |
            type=raw,value=dev
            type=sha,prefix={{branch}}-

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          no-cache: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare server directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            mkdir -p /srv/apps/meeting-summary-dev
            touch /srv/apps/meeting-summary-dev/.env.dev
            rm -f /srv/apps/meeting-summary-dev/docker-compose.dev.yml

      - name: Copy docker-compose.dev.yml to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "docker-compose.dev.yml"
          target: "/srv/apps/meeting-summary-dev"

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: GITHUB_TOKEN
          script: |
            cd /srv/apps/meeting-summary-dev

            # Login to GHCR using the fresh per-run GITHUB_TOKEN
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u fahizkp --password-stdin

            # Pull the LATEST dev images
            docker pull ghcr.io/wisdom-youth-mlpe/meeting-summary-frontend:dev
            docker pull ghcr.io/wisdom-youth-mlpe/meeting-summary-backend:dev

            # Log pulled image digest for verification
            echo "=== Deployed frontend image ==="
            docker inspect --format='{{index .RepoDigests 0}}' ghcr.io/wisdom-youth-mlpe/meeting-summary-frontend:dev

            # Stop old containers cleanly
            docker compose -f docker-compose.dev.yml down --remove-orphans || true

            # Start fresh - force-recreate ensures the new image is used
            docker compose -f docker-compose.dev.yml up -d --force-recreate

            echo "=== Running containers ==="
            docker ps --filter "name=meeting-summary" --format "table {{.Names}}\t{{.Image}}\t{{.Status}}"

            # Clean up dangling images only
            docker image prune -f
